name: Build Metropolis

on:
  push:
    branches: [ "1.20.1-fabric-mtr4", "1.20.1-fabric", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "1.20.1-fabric-mtr4", "1.20.1-fabric", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Modrinth Maven 对某些默认 UA 会返回 403，伪装浏览器 UA 以免拉不到 MTR 依赖
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dfile.encoding=UTF-8
    -Dorg.gradle.internal.http.useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

jobs:
  build:
    name: Build (JDK 17 / Gradle 8.8 / Fabric Loom 1.7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Read mod version
        id: mod
        run: |
          version=$(grep -E '^[[:space:]]*mod_version[[:space:]]*=' gradle.properties \
            | head -1 | cut -d '=' -f 2- | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Mod version: $version"

      - name: Grant execute permission for gradlew
        run: chmod +x .@command:gradlew

      # 仓库自带的 networkTimeout=10000 在 CI 上偶发导致 "Downloading ... failed: timeout"
      - name: Relax Gradle wrapper network timeout
        run: |
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build with Gradle
        run: .@command:gradlew build --stacktrace

      - name: Collect jars
        run: |
          mkdir -p artifacts
          # 只要正式 jar 和源码 jar，剔除 loom 的中间产物（*-dev.jar）
          for f in build/libs/*.jar; do
            case "$f" in
              *-dev.jar) continue ;;
            esac
            cp "$f" artifacts/
          done
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Metropolis-${{ steps.mod.outputs.version }}
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload jars
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
